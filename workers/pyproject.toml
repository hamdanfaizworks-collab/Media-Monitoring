[project]
name = "mediawatch-workers"
version = "0.1.0"
description = "Worker akuisisi dan analisis Media Monitoring (PRD v1.0)"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
